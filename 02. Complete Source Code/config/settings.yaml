# AssureX Claim Engine - Central Settings
# All thresholds and model version live here. No magic numbers in source code.

model_version: "v2"

# --- Dual-Model Comparison Thresholds (comparison.py) ---
# confidence below this -> "Uncertain Result"
uncertainty_threshold: 0.60
# confidence diff below this -> "Strong Match"
strong_match_threshold: 0.10
# confidence diff up to this -> "Acceptable Match"; above -> "Weak Match"
acceptable_match_threshold: 0.25

# --- OCR settings ---
# DPI used when rendering a PDF page to a raster image for EasyOCR
pdf_render_dpi: 200

# --- Startup settings ---
# Seconds submit route will wait for background model loading before returning 503
model_ready_timeout_seconds: 15

# --- Warranty alerts & monitoring ---
warranty_alert_days: 30
disagreement_alert_rate: 0.20
manual_review_spike_rate: 0.40
